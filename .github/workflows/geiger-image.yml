# Geiger Sign: build the Docker image and publish it to GHCR. Upstream Documenso workflows are removed from this fork.
name: Geiger Sign image

on:
  push:
    branches: [geiger]
    tags: ['geiger-v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: geiger-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # Full history so the branding check can diff against the upstream tag
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Branding and licence check
        run: node scripts/geiger/check-branding.mjs

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/geiger-v') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GEIGER_SOURCE_URL=https://github.com/${{ github.repository }}/tree/${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
